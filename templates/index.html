<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="VERA20k Web 版，在浏览器中运行《红色警戒2：尤里的复仇》，导入本机游戏资源即可开始游戏。">
<title>VERA20k · 红色警戒2：尤里的复仇</title>
<style>
body{margin:0;background:#11151b;color:#e0e6ee;font:15px system-ui}header{padding:16px 24px;border-bottom:1px solid #343d49}h1{font-size:22px;margin:0 0 10px}p{margin:8px 0;color:#b1bdca}button,input{font:inherit;margin:8px 12px 8px 0}button{padding:8px 18px;cursor:pointer}#game{display:flex;justify-content:center;margin:12px auto}canvas{width:min(960px,100%);height:auto;aspect-ratio:8/5;outline:none;display:block}#status{white-space:pre-wrap;color:#a8d7ff}
</style>
<header><h1>VERA20k · Web 预览</h1>
<p>选择你本机的《红色警戒2：尤里的复仇》游戏目录。资源仅在当前浏览器读取，不上传服务器。</p>
<p>需要支持 WebGPU 的桌面浏览器。首版使用单线程、关闭音频；暂不支持联网、存档和随机地图。</p>
<input id="files" type="file" webkitdirectory multiple><button id="start" disabled>启动游戏</button>
<div id="status">正在初始化 WebAssembly…</div></header><main id="game"></main>
<aside aria-label="免责声明"><strong>免责声明：</strong>
<p>当前红警项目基于 VERA20k 开源项目实现，与 Electronic Arts Inc. 没有任何关联。所有权利均归其各自所有者所有。</p></aside>
<script type="module">
import init, {import_file, start_game} from './pkg/vera20k.js';
const status=document.querySelector('#status'), button=document.querySelector('#start'), files=document.querySelector('#files');
let ready=false;
try {
 if(!navigator.gpu) throw Error('当前浏览器未提供 WebGPU，请使用支持 WebGPU 的浏览器。');
 await init(); ready=true; status.textContent='请选择原版游戏目录。';
} catch(error) {status.textContent='初始化失败：'+error;}
files.onchange=()=>{button.disabled=!ready||!files.files.length;};
button.onclick=async()=>{
 button.disabled=true;files.disabled=true;
 try {
 const selected=[...files.files];
 // Import gameplay archives and loose game data, excluding movies/music and executables.
 const keep=selected.filter(f=>/\.(mix|mmx|yro|ini|map|mpr|yrm|csf|fnt|pal|shp|vxl|hva|tmp|vpl|pcx)$/i.test(f.name)&& !/^(movies\d*|movmd\d*|theme|thememd)\.mix$/i.test(f.name));
 for(let i=0;i<keep.length;i++){
  const f=keep[i], relative=(f.webkitRelativePath||f.name).split('/').slice(f.webkitRelativePath?1:0).join('/');
  status.textContent=`读取资源 ${i+1}/${keep.length}：${relative}`;
  import_file(relative,new Uint8Array(await f.arrayBuffer()));
  await new Promise(r=>setTimeout(r,0));
 }
 status.textContent='资源读取完成，正在创建渲染器…';
 start_game();
 }catch(error){status.textContent='启动失败：'+error+'\n请刷新页面后重试。';}
};
</script></html>
