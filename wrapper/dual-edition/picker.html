<fieldset class="edition-picker" id="edition-picker">
  <legend>选择游戏版本</legend>
  <div class="edition-options">
    <label class="edition-choice edition-ra2">
      <input type="radio" name="game-edition" value="ra2" aria-label="红色警戒 2 原版">
      <span class="edition-card">
        <svg viewBox="0 0 72 56" aria-hidden="true">
          <path d="M13 13h31l7 8h13v23H8V21h5Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <path d="m27 16 13 0 6 8h16M15 34h42M18 44a4 4 0 1 0 8 0m7 0a4 4 0 1 0 8 0m7 0a4 4 0 1 0 8 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="m24 25 4 3 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <strong>红色警戒 2</strong><small>原版 · RA2</small>
      </span>
    </label>
    <label class="edition-choice edition-yr">
      <input type="radio" name="game-edition" value="yr" aria-label="尤里的复仇" checked>
      <span class="edition-card">
        <svg viewBox="0 0 72 56" aria-hidden="true">
          <path d="M13 28Q36 3 59 28Q36 53 13 28Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <path d="M29 28a7 7 0 1 1 14 0 7 7 0 0 1-14 0Z" fill="currentColor"/>
          <path d="M36 5v6m0 34v6M7 22v12m58-12v12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <strong>尤里的复仇</strong><small>资料片 · YR</small>
      </span>
    </label>
  </div>
</fieldset>
<div id="ra2-import" class="ra2-import" hidden>
  <p id="ra2-picker-note">请选择你自己的原版游戏资源。文件只在浏览器中读取，不会上传。</p>
  <input id="ra2-directory" type="file" webkitdirectory multiple hidden>
  <input id="ra2-files" type="file" accept=".mix,.csf,.ini,.map,.mpr,.mmx,.fnt,.shp,.aud,.bik,.bag,.idx,.wav,.pal,.txt" multiple hidden>
  <div class="ra2-import-actions"><button id="ra2-choose" type="button">选择游戏文件夹</button><button id="ra2-multi" type="button">手动选择文件</button></div>
  <p class="ra2-feedback" id="ra2-feedback" role="status" aria-live="polite"></p>
  <p role="alert" id="ra2-save-alert" hidden></p>
  <button id="ra2-reset" type="button" hidden>返回版本选择</button>
</div>
<button class="menu-button launch-button edition-start" id="edition-start" type="button" disabled>启动游戏</button>
