name: Prepare an unpublished experimental RA2 Pages candidate
on:
  push:
    branches: [ci/pages-ra2-stage-e821c29]
permissions:
  actions: read
  contents: write
concurrency:
  group: pages-ra2-stage-e821c29
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'iamapig120/vera20k' && github.ref == 'refs/heads/ci/pages-ra2-stage-e821c29'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check exact build provenance, fragment navigation and candidate tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=dd22bd98ab2996aff05736106e5d81ee13aa8eea
          expected=b3fc33e8eee2170822781c9eec43a8b8990895a4c4479d02ccf81f21a5f151b8
          head=e821c29d1de7962c348965b8e3011f6f735614a7
          run_id=45555005667
          artifact_id=14994859803
          ref=refs/heads/stage/pages-ra2-e821c29d1de7
          temp=$(mktemp -d)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" | jq -e --arg head "$head" '.head_sha==$head and .conclusion=="success" and .status=="completed"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" | jq -e --arg head "$head" --arg hash "sha256:$expected" --argjson run "$run_id" --argjson artifact "$artifact_id" '.id==$artifact and .name=="pages-ra2-926a036-pure-v3" and .expired==false and .digest==$hash and .workflow_run.id==$run and .workflow_run.head_sha==$head' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$temp/outer.zip"
          printf '%s  %s\n' "$expected" "$temp/outer.zip" | sha256sum -c -
          git fetch --depth=1 origin refs/heads/gh-pages
          test "$(git rev-parse FETCH_HEAD)" = "$base"
          git worktree add --detach "$temp/pages" "$base"
          git -C "$temp/pages" config user.name 'github-actions[bot]'
          git -C "$temp/pages" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/ra2-stage/stage-ra2-v3.py "$temp/pages" "$temp/outer.zip" | tee "$temp/receipt.json"
          jq -e '.tree=="2c994dab9708fa0da35e6a3621de9f0e678a68aa" and .newFiles==44 and .modified==["index.html"]' "$temp/receipt.json" >/dev/null
          CHROME_BIN="$(command -v google-chrome)" node .github/ra2-stage/chromium-smoke-v2.mjs "$temp/pages/releases/e821c29d1de7" | tee "$temp/browser.json"
          jq -e '.fragmentRevealsRa2 and .pureFolderAcceptedWithoutRa2md and .yrHiddenOnRa2Route and .isolatedResourceCache and .optionalCollapsed and .missingMultiKeepsYr and .launchedGame==false' "$temp/browser.json" >/dev/null
          # The empty lease makes this fail if the non-live ref already exists.
          git -C "$temp/pages" push --force-with-lease="$ref:" origin "HEAD:$ref"
          cat "$temp/receipt.json" "$temp/browser.json" >> "$GITHUB_STEP_SUMMARY"
